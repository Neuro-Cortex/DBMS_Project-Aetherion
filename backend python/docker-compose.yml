version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: aetherion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aetherion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aetherion_secret}
      POSTGRES_DB: ${POSTGRES_DB:-aetherion_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./smart-hospital-database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aetherion}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aetherion-network

  # Redis (for caching & Celery)
  redis:
    image: redis:7-alpine
    container_name: aetherion-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aetherion-network

  # MongoDB (for hospital database module)
  mongodb:
    image: mongo:7
    container_name: aetherion-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mongo_secret}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-aetherion_hospital}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./smart-hospital-database/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aetherion-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend-python/smart-hospital-backend
      dockerfile: Dockerfile
    container_name: aetherion-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aetherion}:${POSTGRES_PASSWORD:-aetherion_secret}@postgres:5432/${POSTGRES_DB:-aetherion_db}
      MONGODB_URL: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-mongo_secret}@mongodb:27017/${MONGO_DB:-aetherion_hospital}?authSource=admin
      
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      
      # Security
      SECRET_KEY: ${SECRET_KEY:-your_super_secret_key_change_in_production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      
      # Email
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      
      # SMS
      SMS_API_KEY: ${SMS_API_KEY}
      
      # AI
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      
      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./backend-python/smart-hospital-backend:/app
      - backend_logs:/app/logs
      - backend_media:/app/media
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - aetherion-network

  # Celery Worker
  celery-worker:
    build:
      context: ./backend-python/smart-hospital-backend
      dockerfile: Dockerfile
    container_name: aetherion-celery-worker
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aetherion}:${POSTGRES_PASSWORD:-aetherion_secret}@postgres:5432/${POSTGRES_DB:-aetherion_db}
      MONGODB_URL: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-mongo_secret}@mongodb:27017/${MONGO_DB:-aetherion_hospital}?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    networks:
      - aetherion-network

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: ./backend-python/smart-hospital-backend
      dockerfile: Dockerfile
    container_name: aetherion-celery-beat
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aetherion}:${POSTGRES_PASSWORD:-aetherion_secret}@postgres:5432/${POSTGRES_DB:-aetherion_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
    command: celery -A app.tasks.celery_app beat --loglevel=info
    networks:
      - aetherion-network

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: aetherion-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_WS_URL: ws://localhost:8000/ws
      VITE_ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0
    networks:
      - aetherion-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: aetherion-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - frontend_build:/var/www/frontend
    networks:
      - aetherion-network

networks:
  aetherion-network:
    driver: bridge
    name: aetherion-network

volumes:
  postgres_data:
    name: aetherion-postgres-data
  redis_data:
    name: aetherion-redis-data
  mongo_data:
    name: aetherion-mongo-data
  backend_logs:
    name: aetherion-backend-logs
  backend_media:
    name: aetherion-backend-media
  frontend_build:
    name: aetherion-frontend-build