[pytest]
# Pytest configuration
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto

# Output options
addopts =
    -v
    -s
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Custom markers
markers =
    asyncio: mark test as asyncio test
    slow: mark test as slow running
    integration: mark test as integration test
    unit: mark test as unit test
    auth: mark test as authentication test
    database: mark test requiring database
    redis: mark test requiring Redis

# Coverage options
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=80

# Timeout
timeout = 300
timeout_method = signal

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:.*sqlalchemy.*