<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="#0a0a14" stroke="url(#grad)" stroke-width="2"/>
  
  <!-- Heart Icon -->
  <path d="M50 75L25 50C18 43 18 31 25 24C32 17 44 17 50 25C56 17 68 17 75 24C82 31 82 43 75 50L50 75Z" 
        fill="url(#grad)" 
        filter="url(#glow)"
        opacity="0.9"/>
  
  <!-- Pulse Line -->
  <path d="M20 50H35L42 35L50 65L58 35L65 50H80" 
        stroke="white" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none"
        opacity="0.9"/>
  
  <!-- Cross/Plus -->
  <g transform="translate(50,50)" stroke="white" stroke-width="2.5" stroke-linecap="round">
    <line x1="0" y1="-8" x2="0" y2="8" opacity="0.7"/>
    <line x1="-8" y1="0" x2="8" y2="0" opacity="0.7"/>
  </g>
</svg>