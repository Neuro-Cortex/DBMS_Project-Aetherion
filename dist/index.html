    <script>
      (function() {
        // Advanced loader management
        window.AetherionLoader = {
          steps: ['Initializing', 'Loading Modules', 'Connecting Services', 'Preparing Interface'],
          currentStep: 0,
          
          updateStep: function(stepIndex) {
            this.currentStep = stepIndex;
            const steps = document.querySelectorAll('.loader-step');
            steps.forEach((step, index) => {
              step.classList.remove('active', 'completed');
              if (index < stepIndex) step.classList.add('completed');
              if (index === stepIndex) step.classList.add('active');
            });
          },
          
          remove: function() {
            const loader = document.querySelector('.app-loader');
            if (loader) {
              loader.classList.add('fade-out');
              setTimeout(() => {
                if (loader && loader.parentNode) {
                  loader.parentNode.removeChild(loader);
                }
              }, 500);
            }
          }
        };

        // Simulate loading steps
        let stepInterval = setInterval(() => {
          if (window.AetherionLoader.currentStep < window.AetherionLoader.steps.length - 1) {
            window.AetherionLoader.updateStep(window.AetherionLoader.currentStep + 1);
          } else {
            clearInterval(stepInterval);
          }
        }, 400);

        // Remove loader when page is ready
        window.removeLoader = function() {
          clearInterval(stepInterval);
          window.AetherionLoader.updateStep(window.AetherionLoader.steps.length);
          setTimeout(window.AetherionLoader.remove, 300);
        };

        // Fallback timeout
        setTimeout(window.removeLoader, 5000);

        // Listen for load event
        window.addEventListener('load', function() {
          setTimeout(window.removeLoader, 200);
        });

        // Listen for custom event from React
        window.addEventListener('react-app-ready', window.removeLoader);
      })();
    </script>
